<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1B3424" />
    <meta name="description" content="Hisabi · حسابي — Your personal finance tracker for Bahrain" />

    <!-- PWA / Add to Home Screen -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet" />

    <title>Hisabi · حسابي</title>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #0f1e15; color: #F6EAC8; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
      #root { height: 100vh; overflow: hidden; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: #0f1e15; }
      ::-webkit-scrollbar-thumb { background: #2a4a33; border-radius: 99px; }
      input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
      input::placeholder { color: #5a6145; }
      select option { background: #1B3424; color: #F6EAC8; }
      @media (min-width: 768px) { .mobile-only { display: none !important; } }
      @media (max-width: 767px) { .desktop-only { display: none !important; } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Hisabi.</noscript>
    <div id="root"></div>
  </body>
</html>
