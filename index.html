<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#1B3424"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Hisabi"/>
<title>Hisabi · حسابي</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f1e15;color:#F6EAC8;font-family:'Plus Jakarta Sans','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0f1e15}::-webkit-scrollbar-thumb{background:#2a4a33;border-radius:99px}
input,select,button{font-family:'Plus Jakarta Sans',sans-serif;outline:none}
input::placeholder{color:#5a6145}
select option{background:#1B3424;color:#F6EAC8}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

.app{display:flex;flex-direction:column;height:100vh;height:-webkit-fill-available;overflow:hidden}

/* Header */
.header{background:#162b1c;border-bottom:1px solid #2a4a33;padding:14px 18px 0;flex-shrink:0}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo-tag{font-size:9px;letter-spacing:3px;color:#898F65;text-transform:uppercase;font-weight:700}
.logo-name{font-family:'Lora',serif;font-size:22px;font-weight:700;color:#F6EAC8}
.logo-arabic{font-family:'Scheherazade New',serif;font-size:17px;color:#898F65;margin-left:8px}
.balance-label{font-size:10px;color:#8a7d61;text-align:right}
.balance-val{font-family:'Lora',serif;font-size:20px;font-weight:700;text-align:right}

/* Bottom nav */
.bottom-nav{display:flex;background:#162b1c;border-top:1px solid #2a4a33;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 2px;border:none;background:transparent;color:#8a7d61;cursor:pointer;border-top:2px solid transparent;transition:all 0.15s;font-family:'Plus Jakarta Sans',sans-serif}
.nav-btn.active{color:#898F65;border-top-color:#898F65}
.nav-btn span:first-child{font-size:18px}
.nav-btn span:last-child{font-size:9px;margin-top:3px;font-weight:600}

/* Content */
.content{flex:1;overflow-y:auto;padding:16px}

/* Cards */
.card{background:#1B3424;border-radius:14px;padding:18px;border:1px solid #2a4a33;margin-bottom:14px}
.card-title{font-family:'Lora',serif;font-size:15px;font-weight:600;color:#F6EAC8;margin-bottom:12px}
.lbl{font-size:10px;color:#8a7d61;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;font-weight:600}
.num{font-family:'Lora',serif;font-weight:700}

/* Grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:#1B3424;border-radius:12px;padding:14px;border:1px solid #2a4a33}

/* Bar */
.bar-track{background:#0f1e15;border-radius:99px;overflow:hidden}
.bar-fill{border-radius:99px;transition:width 0.4s}

/* Input/Button */
.inp{background:#0f1e15;border:1px solid #2a4a33;border-radius:8px;color:#F6EAC8;padding:9px 11px;font-size:12px;width:100%}
.btn-primary{background:#2a4a33;color:#F6EAC8;border:1px solid #898F65;border-radius:8px;padding:9px 16px;font-size:12px;font-weight:600;cursor:pointer;width:100%;margin-top:8px}
.btn-ghost{background:#1B3424;color:#8a7d61;border:1px solid #2a4a33;border-radius:8px;padding:7px 12px;font-size:11px;cursor:pointer}
.btn-income{background:#1a2a1a;color:#898F65;border:1px solid #898F6555;border-radius:8px;padding:9px 16px;font-size:12px;font-weight:600;cursor:pointer;width:100%;margin-top:8px}

/* Quick log tiles */
.ql-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.ql-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:78px;height:78px;border-radius:13px;border:2px solid;background:#0f1e15;cursor:pointer;transition:all 0.15s}
.ql-tile:active{transform:scale(0.92)}
.ql-add{width:78px;height:78px;border-radius:13px;border:2px dashed #2a4a33;background:transparent;cursor:pointer;color:#5a6145;font-size:24px;display:flex;align-items:center;justify-content:center}

/* Transaction row */
.tx-row{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:#0f1e15;border-radius:8px;border:1px solid #2a4a3366;margin-bottom:7px}
.tx-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-right:8px}
.tx-desc{font-size:13px;color:#F6EAC8}
.tx-meta{font-size:10px;color:#8a7d61}
.tx-del{background:none;border:none;cursor:pointer;color:#8a7d61;font-size:15px;padding:0 4px}

/* Goal bar */
.goal-bar{background:#0f1e15;border-radius:99px;height:10px;overflow:hidden;margin:10px 0}

/* Debt row */
.debt-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#0f1e15;border-radius:8px;margin-bottom:8px}
.settle-btn{font-size:10px;padding:4px 10px;border-radius:99px;cursor:pointer;border:1px solid}

/* Chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 185px)}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.msg-user{align-self:flex-end;background:#5a6145;color:#F6EAC8;padding:11px 14px;border-radius:18px 18px 4px 18px;max-width:83%;font-size:13px;line-height:1.65;white-space:pre-wrap}
.msg-ai{align-self:flex-start;background:#1B3424;color:#F6EAC8;padding:11px 14px;border-radius:18px 18px 18px 4px;max-width:83%;font-size:13px;line-height:1.65;border:1px solid #2a4a33;white-space:pre-wrap}
.chat-input-row{display:flex;gap:8px;margin-top:8px}
.chat-inp{background:#0f1e15;border:1px solid #2a4a33;border-radius:8px;color:#F6EAC8;padding:11px 14px;font-size:13px;flex:1}
.chat-send{background:#2a4a33;color:#F6EAC8;border:1px solid #898F65;border-radius:8px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer}
.quick-prompts{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.qp-btn{font-size:10px;padding:5px 10px;border-radius:99px;border:1px solid #2a4a33;background:#1B3424;color:#8a7d61;cursor:pointer}

/* History table */
.hist-table{display:grid;grid-template-columns:auto 1fr 1fr 1fr 1fr;gap:6px 10px;font-size:11px;min-width:340px}
.hist-head{color:#8a7d61;font-weight:600;padding-bottom:6px;border-bottom:1px solid #2a4a33}

/* Form row */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.form-full{grid-column:span 2}

/* Alert */
.alert{border-radius:12px;padding:14px;margin-bottom:14px}
.alert-warn{background:#2a1810;border:1px solid #c17a5a55}
.alert-pos{background:#1a2a1a;border:1px solid #898F6544}

/* Type pills */
.type-pills{display:flex;gap:6px;flex-wrap:wrap}
.type-pill{padding:4px 10px;border-radius:99px;font-size:11px;cursor:pointer;border:1px solid;background:transparent}

/* Section header */
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

/* Collapsible form */
.form-box{background:#0f1e15;border-radius:10px;padding:14px;border:1px solid #2a4a33;margin-top:12px}

/* Scrollable */
.scroll-x{overflow-x:auto}

/* History bars */
.hist-bars{display:flex;align-items:flex-end;gap:5px;height:80px;margin-bottom:14px}
.hist-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.hist-bar{width:100%;border-radius:4px 4px 0 0}
.hist-bar-lbl{font-size:8px;color:#8a7d61}

/* Icon picker */
.icon-picker{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.icon-btn{background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 5px;cursor:pointer;font-size:16px}
.icon-btn.sel{background:#2a4a33;border-color:#898F65}
.color-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.color-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.color-dot.sel{border-color:#F6EAC8}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="logo-tag">حسابي · BHD</div>
        <div style="display:flex;align-items:baseline">
          <span class="logo-name">Hisabi</span>
          <span class="logo-arabic">حسابي</span>
        </div>
      </div>
      <div>
        <div class="balance-label">Balance</div>
        <div class="balance-val" id="header-balance">BD 0.000</div>
      </div>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="bottom-nav" id="bottom-nav"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const C={olive:"#898F65",sand:"#F6EAC8",sky:"#BCD4E6",skyDim:"#8aafc8",warning:"#d4a853",negative:"#c17a5a",sandFaint:"#8a7d61",sandDim:"#c8ba98",border:"#2a4a33",bg:"#0f1e15",surface:"#1B3424"};
const CATS=["Housing","Food","Transport","Utilities","Entertainment","Health","Shopping","Savings","Other"];
const CAT_COLORS={Housing:C.olive,Food:C.warning,Transport:C.sky,Utilities:C.skyDim,Entertainment:"#b8a0c8",Health:"#7ab89a",Shopping:C.negative,Savings:C.sand,Other:C.sandFaint};
const GOAL_ICONS=["💍","✈️","🏠","🚗","🛡️","📱","🎓","💻","🎸","🌴","💊","🎯","📚","🏋️","👔","🎮","🧳","🐾"];
const GOAL_COLORS=[C.sand,C.olive,C.sky,C.warning,"#b8a0c8","#7ab89a",C.negative,C.skyDim];
const SC_ICONS=["☕","🧃","🥤","🍔","🍕","🥪","🛺","🚌","⛽","🅿️","💊","🧴","🎮","🎬","🛒","🍞","🥛","🧹","💈","🌯","🍜","🧋","🐟","🥚"];
const SC_COLORS=[C.warning,C.olive,C.sky,C.sand,"#b8a0c8","#7ab89a",C.negative,C.skyDim];
const NAV=[{id:"dashboard",icon:"📊",label:"Dashboard"},{id:"transactions",icon:"💳",label:"Transactions"},{id:"budget",icon:"📋",label:"Budget"},{id:"goals",icon:"🎯",label:"Goals"},{id:"debts",icon:"🤝",label:"Pay Back"},{id:"history",icon:"📅",label:"History"},{id:"chat",icon:"💬",label:"Ask AI"}];

let state={
  tab:"dashboard",
  salary:1200,carry:0,
  sides:[],
  txs:[
    {id:1,date:"2026-05-02",desc:"Rent",amount:480,category:"Housing"},
    {id:2,date:"2026-05-04",desc:"Lulu",amount:32.5,category:"Food"},
    {id:3,date:"2026-05-06",desc:"Uber",amount:4.2,category:"Transport"},
    {id:4,date:"2026-05-08",desc:"Netflix",amount:3.1,category:"Entertainment"},
    {id:5,date:"2026-05-10",desc:"Pharmacy",amount:8.5,category:"Health"},
    {id:6,date:"2026-05-11",desc:"Dinner Bushido",amount:22.0,category:"Food"},
  ],
  limits:{Housing:500,Food:150,Transport:80,Utilities:60,Entertainment:50,Health:60,Shopping:100,Savings:150,Other:60},
  goals:[
    {id:1,name:"Emergency Fund",icon:"🛡️",color:C.olive,target:2000,saved:450,freq:"monthly",freqAmount:200,deadline:"",type:"save"},
    {id:2,name:"Vacation",icon:"✈️",color:C.sky,target:800,saved:170,freq:"monthly",freqAmount:80,deadline:"2026-12-01",type:"experience"},
  ],
  shortcuts:[
    {id:1,label:"Karak",icon:"☕",amount:0.1,category:"Food",color:C.warning},
    {id:2,label:"Parking",icon:"🅿️",amount:0.2,category:"Transport",color:C.sky},
    {id:3,label:"Batelco",icon:"📡",amount:33.593,category:"Utilities",color:C.skyDim},
  ],
  debts:[
    {id:1,person:"Ali",amount:20,direction:"they-owe",note:"Lunch split",date:"2026-05-01",settled:false},
    {id:2,person:"Sara",amount:15,direction:"i-owe",note:"Petrol",date:"2026-05-05",settled:false},
  ],
  history:[
    {month:"2026-01",income:2110,spent:391.208},
    {month:"2026-02",income:150,spent:260.093},
    {month:"2026-03",income:40.116,spent:216.384},
    {month:"2026-04",income:0,spent:152.593},
  ],
  msgs:[{role:"assistant",text:"مرحبا! I'm your Hisabi assistant 👋\n\nAsk me anything — 'When can I afford my engagement ring?', 'Am I on track this month?', 'Which goal should I focus on?'"}],
  chatLoading:false,
  showScForm:false,showDebtForm:false,showGoalForm:false,
  newSc:{label:"",icon:"☕",amount:"",category:"Food",color:C.warning},
  newTx:{date:tod(),desc:"",amount:"",category:"Food"},
  newSide:{date:tod(),desc:"",amount:""},
  newGoal:{name:"",icon:"🎯",color:C.olive,target:"",saved:"",freq:"monthly",freqAmount:"",deadline:"",type:"save"},
  newDebt:{person:"",amount:"",direction:"i-owe",note:"",date:tod()},
  gInputs:{},
};

// ── Helpers ────────────────────────────────────────────────────────────────
function fmt(n){return"BD "+Number(n).toLocaleString("en-BH",{minimumFractionDigits:3,maximumFractionDigits:3});}
function tod(){return new Date().toISOString().split("T")[0];}
function daysLeft(){const n=new Date();return new Date(n.getFullYear(),n.getMonth()+1,0).getDate()-n.getDate();}
function daysTotal(){const n=new Date();return new Date(n.getFullYear(),n.getMonth()+1,0).getDate();}
function moUntil(s){if(!s)return null;const[y,m]=s.split("-").map(Number),n=new Date();return Math.max(0,(y-n.getFullYear())*12+(m-1-n.getMonth()));}
function h(tag,attrs,children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")el.className=v;
    else el.setAttribute(k,v);
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c==null||c===false)return;
      el.appendChild(typeof c==="string"?document.createTextNode(c):c);
    });
  }
  return el;
}

// ── Derived ────────────────────────────────────────────────────────────────
function derived(){
  const totalSide=state.sides.reduce((s,i)=>s+Number(i.amount),0);
  const totalIncome=Number(state.salary)+totalSide+state.carry;
  const byCat=CATS.reduce((a,c)=>{a[c]=state.txs.filter(t=>t.category===c).reduce((s,t)=>s+Number(t.amount),0);return a;},{});
  const totalSpent=Object.values(byCat).reduce((a,b)=>a+b,0);
  const balance=totalIncome-totalSpent;
  const dp=new Date().getDate();
  const rate=dp>0?totalSpent/dp:0;
  const projSpend=rate*daysTotal();
  const owedToMe=state.debts.filter(d=>!d.settled&&d.direction==="they-owe").reduce((s,d)=>s+Number(d.amount),0);
  const iOwe=state.debts.filter(d=>!d.settled&&d.direction==="i-owe").reduce((s,d)=>s+Number(d.amount),0);
  const overBudget=CATS.filter(c=>byCat[c]>state.limits[c]);
  return{totalSide,totalIncome,byCat,totalSpent,balance,rate,projSpend,owedToMe,iOwe,overBudget};
}
function histRows(){let c=0;return state.history.map(h=>{const net=c+h.income-h.spent;const r={...h,carry:c,net};c=net;return r;});}

// ── Render ─────────────────────────────────────────────────────────────────
function render(){
  const d=derived();
  const dl=daysLeft();

  // Header balance
  const hb=document.getElementById("header-balance");
  if(hb){hb.textContent=fmt(d.balance);hb.style.color=d.balance>=0?C.olive:C.negative;}

  // Nav
  const nav=document.getElementById("bottom-nav");
  nav.innerHTML="";
  NAV.forEach(n=>{
    const btn=h("button",{className:"nav-btn"+(state.tab===n.id?" active":""),onClick:()=>{state.tab=n.id;render();}},
      [h("span",null,n.icon),h("span",null,n.label)]
    );
    nav.appendChild(btn);
  });

  // Content
  const content=document.getElementById("content");
  content.innerHTML="";

  if(state.tab==="dashboard") renderDashboard(content,d,dl);
  else if(state.tab==="transactions") renderTransactions(content,d);
  else if(state.tab==="budget") renderBudget(content,d);
  else if(state.tab==="goals") renderGoals(content,d);
  else if(state.tab==="debts") renderDebts(content,d);
  else if(state.tab==="history") renderHistory(content,d,dl);
  else if(state.tab==="chat") renderChat(content);
}

function renderDashboard(el,d,dl){
  // ── Stat cards ──────────────────────────────────────────────────────────
  const grid=h("div",{className:"grid2"},
    [
      ["Total Income",fmt(d.totalIncome),"Salary + carry-forward",C.olive],
      ["Total Spent",fmt(d.totalSpent),"This month so far",C.warning],
      ["End-of-Month Est.",fmt(d.projSpend),"At current daily pace",d.projSpend>d.totalIncome?C.negative:C.sky],
      ["Days Remaining",dl+" days","Left in "+new Date().toLocaleString("en",{month:"long"}),C.skyDim]
    ].map(([l,v,sub,col])=>{
      const card=h("div",{className:"stat-card"});
      card.appendChild(h("div",{className:"lbl"},l));
      card.appendChild(h("div",{className:"num",style:{fontSize:14,color:col}},v));
      card.appendChild(h("div",{style:{fontSize:9,color:C.sandFaint,marginTop:3}},sub));
      return card;
    })
  );
  el.appendChild(grid);

  // ── Debt banners ─────────────────────────────────────────────────────────
  if(d.iOwe>0||d.owedToMe>0){
    const dg=h("div",{className:"grid2"});
    if(d.iOwe>0) dg.appendChild(h("div",{className:"stat-card alert-warn"},[h("div",{className:"lbl"},"You Owe"),h("div",{className:"num",style:{fontSize:16,color:C.negative}},fmt(d.iOwe))]));
    if(d.owedToMe>0) dg.appendChild(h("div",{className:"stat-card alert-pos"},[h("div",{className:"lbl"},"Owed to You"),h("div",{className:"num",style:{fontSize:16,color:C.olive}},fmt(d.owedToMe))]));
    el.appendChild(dg);
  }

  // ── Over budget alert ────────────────────────────────────────────────────
  if(d.overBudget.length>0){
    el.appendChild(h("div",{className:"alert alert-warn"},[
      h("div",{style:{color:C.negative,fontWeight:600,marginBottom:4}},"⚠ Over Budget"),
      h("div",{style:{fontSize:12,color:C.sandDim}},d.overBudget.join(", "))
    ]));
  }

  // ── Spending by Category — icon grid 2 columns ───────────────────────────
  const spCard=h("div",{className:"card"});
  spCard.appendChild(h("div",{className:"card-title"},"Spending by Category"));
  const catGrid=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}});

  const CAT_ICONS={"Housing":"🏠","Food":"🍽️","Transport":"🚗","Utilities":"💡","Entertainment":"🎬","Health":"💊","Shopping":"🛍️","Savings":"💰","Other":"📦"};

  CATS.filter(c=>d.byCat[c]>0||state.limits[c]>0).forEach(cat=>{
    const pct=Math.min((d.byCat[cat]/state.limits[cat])*100,100);
    const over=d.byCat[cat]>state.limits[cat];
    const col=over?C.negative:CAT_COLORS[cat];

    const card=h("div",{style:{
      background:C.bg,borderRadius:12,padding:"12px 10px 10px",
      border:"1px solid "+C.border,
      display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center"
    }});

    // Icon in soft circle
    const circle=h("div",{style:{
      width:44,height:44,borderRadius:"50%",
      background:col+"25",
      display:"flex",alignItems:"center",justifyContent:"center",
      fontSize:20,marginBottom:8
    }},CAT_ICONS[cat]||"•");
    card.appendChild(circle);

    // Category name
    card.appendChild(h("div",{style:{fontSize:10,color:C.sandDim,marginBottom:4,fontWeight:500}},cat));

    // Spent amount
    card.appendChild(h("div",{style:{fontFamily:"'Lora',serif",fontSize:12,fontWeight:700,color:col,marginBottom:2}},
      "BD "+Number(d.byCat[cat]).toFixed(3)
    ));

    // Limit
    card.appendChild(h("div",{style:{fontSize:9,color:C.sandFaint,marginBottom:8}},
      "of BD "+Number(state.limits[cat]).toFixed(3)
    ));

    // Progress bar
    const track=h("div",{style:{width:"100%",background:C.surface,borderRadius:99,height:4,overflow:"hidden"}});
    track.appendChild(h("div",{style:{width:pct+"%",height:"100%",background:col,borderRadius:99}}));
    card.appendChild(track);

    catGrid.appendChild(card);
  });

  spCard.appendChild(catGrid);
  el.appendChild(spCard);

  // ── Goals ────────────────────────────────────────────────────────────────
  const gCard=h("div",{className:"card"});
  const ghdr=h("div",{className:"sec-hdr"});
  ghdr.appendChild(h("div",{className:"card-title",style:{margin:0}},"🎯 Goals"));
  ghdr.appendChild(h("button",{style:{fontSize:11,color:C.olive,background:"none",border:"none",cursor:"pointer"},onClick:()=>{state.tab="goals";render();}},"View all →"));
  gCard.appendChild(ghdr);
  state.goals.forEach(g=>{
    const pct=Math.min((g.saved/g.target)*100,100);
    const ml=g.freqAmount>0?Math.ceil((g.target-g.saved)/g.freqAmount):null;
    const dl2=moUntil(g.deadline);
    const row=h("div",{style:{marginBottom:14}});

      state.showGoalForm=false;render();
    }},"+ Create Goal"));
    hCard.appendChild(fb);

  state.goals.forEach(g=>{

    const card=h("div",{className:"card",style:{borderColor:done?g.color+"55":urgency?C.negative+"55":C.border}});

    card.appendChild(track);
    const stats=h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:11,color:C.sandFaint,marginBottom:10}});
    ["Saved:"+fmt(g.saved),"Target:"+fmt(g.target),"Left:"+fmt(rem)].forEach(s=>{
      const[l,v]=s.split(":");
      const sp=h("span");sp.appendChild(document.createTextNode(l+" "));
      sp.appendChild(h("span",{style:{color:l==="Saved"?g.color:l==="Left"?C.warning:C.sand,fontFamily:"'Lora',serif",fontWeight:600}},v));
      stats.appendChild(sp);

    if(g.deadline) card.appendChild(h("div",{style:{background:C.bg,borderRadius:8,padding:"7px 11px",fontSize:11,color:C.sandFaint,marginBottom:10}},"📅 "+g.deadline+(dl2!==null?" · "+dl2+" months away":"")));
    if(!done){
      const cr=h("div",{style:{display:"flex",gap:8}});
      const gi=h("input",{className:"inp",type:"number",step:"0.001",placeholder:"Add savings (BD)",value:state.gInputs[g.id]||"",onInput:e=>{state.gInputs[g.id]=e.target.value;},style:{flex:1,padding:"7px 10px",fontSize:12}});
      cr.appendChild(gi);

        const v=Number(state.gInputs[g.id]||0);if(v<=0)return;

        state.gInputs[g.id]="";render();
      }},"+ Save"));
      card.appendChild(cr);
    }
    el.appendChild(card);
  });
}

    fr.appendChild(h("input",{className:"inp",placeholder:"Amount (BD)",type:"number",step:"0.001",value:state.newDebt.amount,onInput:e=>{state.newDebt.amount=e.target.value;}}));
    fr.appendChild(h("input",{className:"inp",type:"date",value:state.newDebt.date,onChange:e=>{state.newDebt.date=e.target.value;}}));
    fr.appendChild(h("input",{className:"inp form-full",placeholder:"Note",value:state.newDebt.note,onInput:e=>{state.newDebt.note=e.target.value;}}));
    fb.appendChild(fr);
    const dirs=h("div",{style:{display:"flex",gap:8,marginBottom:12}});
    [["i-owe","I owe them",C.negative,"#2a1810"],["they-owe","They owe me",C.olive,"#1a2a1a"]].forEach(([val,label,col,bg])=>{
      dirs.appendChild(h("button",{style:{flex:1,padding:"8px",borderRadius:8,border:"1px solid "+(state.newDebt.direction===val?col:C.border),background:state.newDebt.direction===val?bg:"transparent",color:state.newDebt.direction===val?col:C.sandFaint,cursor:"pointer",fontWeight:state.newDebt.direction===val?600:400,fontSize:12},onClick:()=>{state.newDebt.direction=val;render();}},label));
    });
    fb.appendChild(dirs);
    fb.appendChild(h("button",{className:"btn-primary",style:{marginTop:0},onClick:()=>{
      if(!state.newDebt.person||!state.newDebt.amount)return;
      state.debts.push({...state.newDebt,id:Date.now(),amount:Number(state.newDebt.amount),settled:false});
      state.newDebt={person:"",amount:"",direction:"i-owe",note:"",date:tod()};
      state.showDebtForm=false;render();
    }},"+ Add Entry"));
    mainCard.appendChild(fb);
  }
  el.appendChild(mainCard);

  ["they-owe","i-owe"].forEach(dir=>{
    const list=state.debts.filter(d=>!d.settled&&d.direction===dir);
    if(!list.length)return;
    const isIOwe=dir==="i-owe";
    const card=h("div",{className:"card"});
    card.appendChild(h("div",{style:{fontWeight:600,marginBottom:12,color:isIOwe?C.negative:C.olive,fontFamily:"'Lora',serif",fontSize:14}},isIOwe?"You Owe":"Owed to You"));
    list.forEach(debt=>{
      const row=h("div",{className:"debt-row",style:{border:"1px solid "+(isIOwe?C.negative+"33":C.olive+"33")}});
      const left=h("div");
      left.appendChild(h("div",{style:{fontSize:13,fontWeight:500,color:C.sand}},debt.person));
      left.appendChild(h("div",{style:{fontSize:10,color:C.sandFaint}},debt.date+(debt.note?" · "+debt.note:"")));
      row.appendChild(left);
      const right=h("div",{style:{display:"flex",alignItems:"center",gap:10}});
      right.appendChild(h("span",{style:{fontWeight:700,color:isIOwe?C.negative:C.olive,fontFamily:"'Lora',serif",fontSize:13}},fmt(debt.amount)));
      right.appendChild(h("button",{className:"settle-btn",style:{borderColor:isIOwe?C.negative:C.olive,color:isIOwe?C.negative:C.olive,background:isIOwe?"#2a1810":"#1a2a1a"},onClick:()=>{state.debts=state.debts.map(x=>x.id===debt.id?{...x,settled:true}:x);render();}},"✓ Settle"));
      row.appendChild(right);
      card.appendChild(row);
    });
    el.appendChild(card);
  });

  const settled=state.debts.filter(d=>d.settled);
  if(settled.length){
    const card=h("div",{className:"card"});
    card.appendChild(h("div",{style:{fontWeight:600,marginBottom:12,color:C.sandFaint,fontFamily:"'Lora',serif",fontSize:14}},"✓ Settled"));
    settled.forEach(debt=>{
      const row=h("div",{style:{display:"flex",justifyContent:"space-between",padding:"8px 12px",background:C.bg,borderRadius:8,marginBottom:6,opacity:.5}});
      row.appendChild(h("div",{style:{fontSize:12,color:C.sandDim}},debt.person+" · "+debt.note));
      row.appendChild(h("span",{style:{fontSize:12,fontWeight:600,color:C.sandFaint,fontFamily:"'Lora',serif"}},fmt(debt.amount)));
      card.appendChild(row);
    });
    el.appendChild(card);
  }
}

function renderHistory(el,d,dl){
  const card=h("div",{className:"card"});
  card.appendChild(h("div",{className:"card-title"},"📅 Monthly History"));
  card.appendChild(h("div",{style:{fontSize:11,color:C.sandFaint,marginBottom:16}},"Carry-forward balance — like your Google Sheet"));

  const rows=histRows();
  const cur={month:"May 2026",carry:rows[rows.length-1]?rows[rows.length-1].net:0,income:d.totalIncome,spent:d.totalSpent,net:d.balance};
  const all=[...rows,cur];
  const maxAbs=Math.max(...all.map(r=>Math.abs(r.net)),1);

  // Bar chart
  const bars=h("div",{className:"hist-bars"});
  all.forEach((r,i)=>{
    const ht=Math.max((Math.abs(r.net)/maxAbs)*68,4);
    const isCur=i===all.length-1;
    const col=h("div",{className:"hist-bar-col"});
    col.appendChild(h("div",{className:"hist-bar",style:{height:ht+"px",background:r.net>=0?C.olive:C.negative,opacity:isCur?1:0.7,border:isCur?"1px solid "+C.sand+"44":"none"}}));
    col.appendChild(h("div",{className:"hist-bar-lbl",style:{color:isCur?C.sky:C.sandFaint}},r.month.toString().slice(-5).replace("-",".")));
    bars.appendChild(col);
  });
  card.appendChild(bars);

  // Table
  const wrap=h("div",{className:"scroll-x"});
  const table=h("div",{className:"hist-table"});
  ["Month","Carry","Income","Spent","Balance"].forEach(hd=>table.appendChild(h("div",{className:"hist-head"},hd)));
  all.forEach((r,i)=>{
    const isCur=i===all.length-1;
    [
      h("div",{style:{color:isCur?C.sky:C.sandDim,fontWeight:isCur?600:400}},r.month),
      h("div",{style:{color:C.sandFaint,fontFamily:"'Lora',serif"}},fmt(r.carry)),
      h("div",{style:{color:C.olive,fontFamily:"'Lora',serif"}},fmt(r.income)),
      h("div",{style:{color:C.negative,fontFamily:"'Lora',serif"}},fmt(r.spent)),
      h("div",{style:{color:r.net>=0?C.olive:C.negative,fontWeight:600,fontFamily:"'Lora',serif"}},fmt(r.net)),
    ].forEach(cell=>table.appendChild(cell));
  });
  wrap.appendChild(table);card.appendChild(wrap);
  el.appendChild(card);
  el.appendChild(h("div",{className:"card",style:{background:"#162b1c",border:"1px solid "+C.sky+"33"}},[
    h("div",{style:{fontSize:12,color:C.sky,fontWeight:600,marginBottom:6}},"💬 Ask the AI about your history"),
    h("div",{style:{fontSize:11,color:C.sandFaint}},'Try: "Based on my history, when will I have enough for my engagement?"'),
  ]));
}

function renderChat(el){
  const wrap=h("div",{className:"chat-wrap"});
  const msgs=h("div",{className:"chat-msgs",id:"chat-msgs"});
  state.msgs.forEach(m=>{
    msgs.appendChild(h("div",{className:m.role==="user"?"msg-user":"msg-ai"},m.text));
  });
  if(state.chatLoading) msgs.appendChild(h("div",{className:"msg-ai"},"Thinking…"));
  wrap.appendChild(msgs);
  setTimeout(()=>{const cm=document.getElementById("chat-msgs");if(cm)cm.scrollTop=cm.scrollHeight;},50);

  const qp=h("div",{className:"quick-prompts"});
  ["When can I afford my engagement goal?","Am I on track?","Which goal to prioritize?","Clear my debts timeline?"].forEach(p=>{
    qp.appendChild(h("button",{className:"qp-btn",onClick:()=>{const inp=document.getElementById("chat-input");if(inp)inp.value=p;}},p));
  });
  wrap.appendChild(qp);

  const row=h("div",{className:"chat-input-row"});
  const inp=h("input",{className:"chat-inp",id:"chat-input",placeholder:"Ask anything about your finances…"});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")sendChat();});
  row.appendChild(inp);
  row.appendChild(h("button",{className:"chat-send",onClick:sendChat},"Send"));
  wrap.appendChild(row);
  el.appendChild(wrap);
}

async function sendChat(){
  const inp=document.getElementById("chat-input");
  if(!inp||!inp.value.trim()||state.chatLoading)return;
  const msg=inp.value.trim();inp.value="";
  state.msgs.push({role:"user",text:msg});
  state.chatLoading=true;render();
  const d=derived();
  const ctx=`HISABI — Bahrain BHD\nSalary:${fmt(state.salary)} Carry:${fmt(state.carry)} Total:${fmt(d.totalIncome)}\nSpent:${fmt(d.totalSpent)} Balance:${fmt(d.balance)} Days left:${daysLeft()}\nProjected:${fmt(d.projSpend)}\n\nSpending:\n${CATS.map(c=>`  ${c}: ${fmt(d.byCat[c])}/${fmt(state.limits[c])} ${d.byCat[c]>state.limits[c]?"OVER":"ok"}`).join("\n")}\n\nGoals:\n${state.goals.map(g=>{const rem=g.target-g.saved;const ml=g.freqAmount>0?Math.ceil(rem/g.freqAmount):null;const dl2=moUntil(g.deadline);return`  ${g.icon} ${g.name}: ${fmt(g.saved)}/${fmt(g.target)}, ${fmt(g.freqAmount)}/${g.freq}, ~${ml||"?"}mo${dl2!==null?", deadline "+dl2+"mo":""}`;}).join("\n")}\n\nDebts:\n${state.debts.filter(x=>!x.settled).map(x=>`  ${x.direction==="i-owe"?"I owe":"Owed:"} ${x.person} ${fmt(x.amount)}`).join("\n")||"None"}\n\nHistory:\n${histRows().map(r=>`  ${r.month}: in ${fmt(r.income)} out ${fmt(r.spent)} bal ${fmt(r.net)}`).join("\n")}`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
        system:"You are a sharp friendly personal finance assistant for Hisabi (حسابي), Bahrain. Currency BHD prefix BD. Use history for forecasting. Answer affordability with real math. Concise, warm, specific. Plain text only.",
        messages:[{role:"user",content:ctx+"\n\nQuestion: "+msg}]})});
    const data=await res.json();
    const reply=data.content&&data.content.map(b=>b.text||"").join("")||"Sorry, try again.";
    state.msgs.push({role:"assistant",text:reply});
  }catch{state.msgs.push({role:"assistant",text:"Something went wrong. Please try again."});}
  state.chatLoading=false;render();
}

function quickLog(s){
  state.txs.push({id:Date.now(),date:tod(),desc:s.label,amount:s.amount,category:s.category});
  // Flash feedback
  const tiles=document.querySelectorAll(".ql-tile");
  render();
}

// ── Boot ───────────────────────────────────────────────────────────────────
render();
</script>
